# Publica o app no Firebase Hosting a cada mudança na branch main, só se todos os testes passarem.
name: Publicar no Firebase (main)
on:
  push:
    branches: [main]
jobs:
  testes:
    uses: ./.github/workflows/testes.yml
  deploy:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nova versão do service worker a cada publicação, para os celulares baixarem a tela nova.
      - name: Versão do service worker
        run: sed -i "s/const VERSAO = '[^']*'/const VERSAO = 'chk-${GITHUB_SHA::7}'/" public/sw.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANUTENCAO_C2F1F }}
          channelId: live
          projectId: manutencao-c2f1f
          # Versão fixa: a 15.34.1 passou a pedir uma permissão (serviceusage) que a conta de serviço não tem.
          firebaseToolsVersion: 15.34.0
      # Publica também as regras do banco. Precisa do papel "Firebase Rules Admin" na conta de serviço;
      # sem ele, este passo falha sem impedir a publicação do site.
      - name: Regras do Firestore
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANUTENCAO_C2F1F }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --only firestore:rules --project manutencao-c2f1f --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
