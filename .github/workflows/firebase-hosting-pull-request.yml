# Em cada pull request, publica uma prévia temporária e comenta o link no PR.
name: Prévia no Firebase (pull request)
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANUTENCAO_C2F1F }}
          projectId: manutencao-c2f1f
          # Versão fixa: a 15.34.1 passou a pedir uma permissão (serviceusage) que a conta de serviço não tem.
          firebaseToolsVersion: 15.34.0
